[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lsquant"
version = "2.0.0"
description = "Python library and SymPy spectral-function front end for the LSQUANT Chebyshev engine"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "sympy",
]

[project.scripts]
lsquant = "lsquant.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lsquant*"]

[tool.setuptools.package-data]
lsquant = ["_core.pyi", "py.typed"]
